name: Backend regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv --without-pip .venv
      - run: python -m pip --python .venv/bin/python install --require-hashes -r backend/requirements-dev.lock
      - run: python -m pip --python .venv/bin/python check
      - run: PYTHONPATH=backend .venv/bin/python -m unittest discover -s backend/tests -v
      - name: Audit installed application dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --path .venv/lib/python3.11/site-packages
