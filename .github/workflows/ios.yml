name: iOS simulator build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Build simulator app without signing
        run: >-
          xcodebuild
          -project frontend/ChatterQuest/ChatterQuest/ChatterQuest.xcodeproj
          -target ChatterQuest
          -configuration '${{ matrix.configuration }}'
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/setup-python@v5
        if: matrix.configuration == 'Debug'
        with:
          python-version: '3.11'
      - name: Test actual client and backend restart recovery
        if: matrix.configuration == 'Debug'
        timeout-minutes: 8
        run: |
          python -m venv --without-pip .http-venv
          python -m pip --python .http-venv/bin/python install --require-hashes -r backend/requirements-dev.lock
          swiftc frontend/ChatterQuest/ChatterQuest/ChatterQuest/APIService.swift frontend/tests/SessionHTTPTests.swift -o /tmp/session-http-tests
          .http-venv/bin/python frontend/tests/session_http.py /tmp/session-http-tests
      - name: Run API client regression scenarios
        if: matrix.configuration == 'Debug'
        run: |
          swiftc frontend/ChatterQuest/ChatterQuest/ChatterQuest/APIService.swift frontend/tests/APIServiceTests.swift -o /tmp/api-client-tests
          /tmp/api-client-tests
